<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050b">
<title>圣诞粒子树 · A Particle Christmas</title>
<meta name="description" content="由 Python 生成的 3D 交互式粒子圣诞树。拖拽旋转、滚轮缩放，点击即可许愿。">
<style>{{CSS}}</style>
</head>
<body>
<main id="app" aria-label="3D 交互式粒子圣诞树">
  <canvas id="scene" aria-label="可以拖拽旋转的三维粒子圣诞树"></canvas>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <header class="hero">
    <div class="eyebrow">
      <span class="eyebrow-rule"></span>
      <span>MERRY CHRISTMAS</span>
    </div>
    <h1>圣诞<span>粒子</span>树</h1>
    <p class="subtitle">由 {{POINT_COUNT}} 颗粒子点亮的冬夜星愿</p>
  </header>

  <aside class="edition" aria-hidden="true">
    <span class="edition-top">A WINTER STUDY</span>
    <span class="edition-rule"></span>
    <span class="edition-bottom">VOL. 01 · {{BUILD_YEAR}}</span>
  </aside>

  <div class="hint" aria-hidden="true">
    <span>拖拽旋转</span><i></i><span>滚轮缩放</span><i></i><span>点击许愿</span>
  </div>

  <section class="controls" role="group" aria-label="场景控制">
    <button id="rotateBtn" class="control is-on" type="button" aria-pressed="true">
      <span class="ctrl-icon" aria-hidden="true">↻</span>
      <span class="ctrl-text"><span class="ctrl-label">自动旋转</span><span class="ctrl-state">ON</span></span>
    </button>

    <button id="snowBtn" class="control is-on" type="button" aria-pressed="true">
      <span class="ctrl-icon" aria-hidden="true">✦</span>
      <span class="ctrl-text"><span class="ctrl-label">落雪</span><span class="ctrl-state">ON</span></span>
    </button>

    <span class="control-divider" aria-hidden="true"></span>

    <button id="paletteBtn" class="control" type="button" title="切换灯光色系">
      <span id="paletteSwatch" class="swatch" aria-hidden="true"></span>
      <span class="ctrl-text"><span class="ctrl-label">光色</span><span id="paletteName" class="ctrl-state accent">极光</span></span>
    </button>

    <button id="resetBtn" class="control" type="button">
      <span class="ctrl-icon reset-icon" aria-hidden="true">⌖</span>
      <span class="ctrl-text"><span class="ctrl-label">重置视角</span><span class="ctrl-state subtle">RESET</span></span>
    </button>
  </section>

  <div class="stats" aria-hidden="true">
    <span>FOLIAGE {{TREE_COUNT}}</span><i></i>
    <span>LIGHTS {{GARLAND_COUNT}}</span><i></i>
    <span>BAUBLES {{ORNAMENT_COUNT}}</span>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-star">✦</span>
    <span>愿望已寄往星空</span>
  </div>

  <div id="loading" class="loading">
    <div class="loading-mark" aria-hidden="true">
      <span class="loading-ring"></span>
      <span class="loading-star">✦</span>
    </div>
    <p>正在点亮圣诞树</p>
    <span class="loading-bar"><i></i></span>
  </div>

  <div id="fallback" class="fallback" hidden>
    <h2>无法启动 3D 场景</h2>
    <p>请使用较新的 Chrome、Edge 或 Safari 浏览器打开，并确认已启用 WebGL。</p>
  </div>

  <noscript>
    <div class="fallback"><h2>需要启用 JavaScript</h2><p>这棵粒子圣诞树由 WebGL 实时渲染，请启用 JavaScript 后刷新页面。</p></div>
  </noscript>
</main>

<script>{{VENDOR_JS}}</script>
<script>window.CHRISTMAS_DATA={{DATA_JSON}};</script>
<script>{{SCENE_JS}}</script>
</body>
</html>
